<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — MotorStar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><img src="images/Motorstar-logo.jpeg" alt=""></div>
      <ul class="nav-menu">
        <li><a href="dashboard.html" class="active">📊 Dashboard</a></li>
        <li><a href="inventory.html">📦 Inventory</a></li>
        <li><a href="#">🛒 Sales</a></li>
        <li><a href="#">📈 Reports</a></li>
        <li><a href="#">⚙️ Settings</a></li>
        <li><a href="#">ℹ️ About</a></li>
        <li><a href="#" id="logoutLink">🚪 Logout</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <span class="menu-toggle" id="menuBtn">☰</span>
        <h1>Dashboard Overview</h1>
        <span id="userEmail"></span>
      </div>

      <div class="cards">
        <div class="card">
          <h3>Total Models</h3>
          <div class="num" id="totalModels">0</div>
        </div>
        <div class="card">
          <h3>Total Stock</h3>
          <div class="num" id="totalStock">0</div>
        </div>
        <div class="card">
          <h3>Low Stock</h3>
          <div class="num" id="lowStock" style="color:#dc2626">0</div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
