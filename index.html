<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MotorStar Inventory — Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h2>🏍️ MotorStar Inventory</h2>
      <div id="alertBox"></div>
      <form id="loginForm">
        <label>Email</label>
        <input type="email" id="email" required placeholder="Enter Admin Email">
        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" required placeholder="Enter password">
          <span class="eye-icon" onclick="togglePassword('password', this)">👁️</span>
        </div>
        <button type="submit" style="margin-top: 1rem;">Login</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { loginUser } from './auth.js';
    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const result = await loginUser(email, pass);
      if (!result.success) {
        document.getElementById('alertBox').innerHTML = `<div class="alert error">${result.message}</div>`;
      }
    });

    
  </script>
  <script>
    function togglePassword(fieldId, icon) {
      const input = document.getElementById(fieldId);
      input.type = input.type === 'password' ? 'text' : 'password';
      icon.textContent = input.type === 'password' ? '👁️' : '🙈';
    }
  </script>
</body>
</html>
