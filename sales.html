<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Transactions — MotorStar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrapper">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <img src="Motorstar-logo.jpeg" alt="MotorStar">
      </div>
      <ul class="nav-menu">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="inventory.html">📦 Inventory</a></li>
        <li><a href="sales.html" class="active">🛒 Sales</a></li>
        <li><a href="reports.html">📈 Reports</a></li>
        <li><a href="settings.html">⚙️ Settings</a></li>
        <li><a href="about.html">ℹ️ About</a></li>
        <li><a href="#" id="logoutLink" onclick="return confirm('Are you sure you want to logout?');">🚪 Logout</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="top-bar">
        <span class="menu-toggle" id="menuBtn">☰</span>
        <h1>🛒 Sales Transactions</h1>
        <span id="userEmail"></span>
      </div>

      <!-- Record Sale Form -->
      <div style="background:white; padding:1.5rem; border-radius:8px; margin-bottom:1.5rem;">
        <h3>Record New Sale</h3>
        <form id="salesForm">
          <label>Select Motorcycle Model</label>
          <select id="modelSelect" required>
            <option value="">-- Select Model --</option>
          </select>

          <label>Unit Price (₱)</label>
          <input type="number" id="unitPrice" readonly>

          <label>Quantity Sold</label>
          <input type="number" id="qtySold" min="1" required>

          <label>Total Amount (₱)</label>
          <input type="number" id="totalAmount" readonly>

          <button type="submit" class="success">💾 Save Sale</button>
        </form>
      </div>

      <!-- Sales History -->
      <h3>Sales History</h3>
      <div class="table-container">
        <table>
          <thead>
            <tr><th>Date</th><th>Model</th><th>Qty</th><th>Total (₱)</th></tr>
          </thead>
          <tbody id="salesTableBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="sales.js"></script>
</body>
</html>
